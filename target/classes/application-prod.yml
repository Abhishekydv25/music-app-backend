spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/musicapp
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate      # Flyway manages schema in prod; JPA only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
  storage:
    provider: s3
    s3:
      bucket: ${S3_BUCKET:music-app-audio}
      region: ${AWS_REGION:ap-south-1}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:https://yourapp.com}
