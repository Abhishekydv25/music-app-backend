server:
  port: ${PORT:8080}    # Render injects PORT dynamically — must bind to it

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/musicapp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate      # Flyway manages schema in prod; JPA only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
  storage:
    provider: local          # uploaded files live on Render's disk — see note in chat about persistence
    local-path: ./uploads
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:*}   # "*" is fine for a personal/APK-only app; tighten if you add a public website